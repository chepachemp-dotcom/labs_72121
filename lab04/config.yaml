# Lab 4 configuration (stored with the run manifest for reproducibility)
dataset:
  name: adult
  version: 2
seed: 42
test_size: 0.30
clip_quantiles: [0.01, 0.99]
expected:
  rows: 48842
  cols: 15
paths:
  raw_csv: ../data/adult_raw.csv   # raw copy, written once, never modified afterwards
  results_dir: results
target: income
positive_label: ">50K"
schema:
  types:
    age: int
    workclass: category
    fnlwgt: int
    education: category
    education-num: int
    marital-status: category
    occupation: category
    relationship: category
    race: category
    sex: category
    capital-gain: int
    capital-loss: int
    hours-per-week: int
    native-country: category
    income: category
  ranges:
    age: [17, 90]
    hours-per-week: [1, 99]
    capital-gain: [0, 99999]
    capital-loss: [0, 4356]
  missing_token: "?"
  allowed_income: ["<=50K", ">50K"]